spring:
  config:
    activate:
      on-profile: test

  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

  cloud:
    aws:
      s3:
        enabled: false
        bucket: "dummy-bucket"
      region:
        static: "ap-northeast-2"
      credentials:
        access-key: "dummy-access-key"
        secret-key: "dummy-secret-key"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

oauth:
  google:
    client-id: "dummy-google-client-id"
    client-secret: "dummy-google-client-secret"
    scope: openid email profile
    redirect-uri: http://localhost:5173/oauth/google/callback

jwt:
  secret: "bXktc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24taW4tc3ByaW5nLWJvb3Q="
  access-expiration-minutes: 15
  refresh-expiration-days: 14
  cookie:
    secure: false

portone:
  api:
    secret: "dummy-portone-api-secret"
  webhook:
    secret: "dummy-portone-webhook-secret"

app:
  frontend-url: "http://localhost:5173"
  init:
    enabled: false

