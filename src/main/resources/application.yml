spring:
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://mysql-server:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    database: mysql
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

  data:
    redis:
      host: redis-server
      port: 6379
      repositories:
        enabled: false

      autoconfigure:
        exclude: org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid email profile
            redirect-uri: "https://localhost:8443/api/customers/google/callback"
            #callback-uri: "https://localhost:5173/oauth/google?code="
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri:  https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

oauth:
  google:
    client-id: xxxx
    client-secret: yyyy
    redirect-uri: https://localhost:8443/oauth/google/redirect
  kakao:
    client-id: xxxx
    redirect-uri: https://localhost:8443/oauth/kakao/redirect

jwt:
  secret: ${JWT_SECRET}
  access-expiration-minutes: 15
  refresh-expiration-days: 14

iamport:
  api-key: ${IAMPORT_API_KEY}
  secret: ${IAMPORT_SECRET}

app:
  backend-url: ${BACKEND_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    #staysplit.hotel_reservation: DEBUG
    p6spy: INFO
    com.p6spy: INFO
