# hotel-search-before-optimization 브랜치 부하 테스트 전용
services:
  old-app:
    image: ${DOCKER_USERNAME}/hotel-reservation-backend:before-opt
    ports:
      - 8080:8080
    environment:
      SERVER_PORT: "8080"
      SERVER_SSL_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/${OLD_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: old-redis
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      # 힙을 호스트 RAM의 70%로 지정하고, OOM 발생 시 좀비로 남지 않도록 종료 후 재시작
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
      TZ: "Asia/Seoul"
    restart: unless-stopped
    depends_on:
      old-redis:
        condition: service_healthy

  old-redis:
    image: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
