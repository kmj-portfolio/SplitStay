name: CI/CD to EC2

on:
  push:
    branches: [ main ]

    paths-ignore:
      - 'README.md'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/hotel-reservation-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2 (pull & up)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # EC2 서버 안의 프로젝트 폴더 
            cd /home/ubuntu/${{ secrets.REPO_NAME_GITHUB }}

            git pull origin main

            umask 077
            cat > .env <<'EOF'
            EC2_HOST=${{ secrets.EC2_HOST }}
            DB_HOST=${{ secrets.DB_HOST }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            REPO_NAME_GITHUB=${{ secrets.REPO_NAME_GITHUB }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            PORTONE_API_SECRET=${{ secrets.PORTONE_API_SECRET }}
            EOF

            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -f