services:
  spring-boot-server:
    image: ${DOCKER_USERNAME}/hotel-reservation-backend:latest
    ports:
      - 8080:8080
    environment:
      SERVER_SSL_ENABLED: "false"
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
    env_file:
      - .env
    volumes:
      - ${HOST_VOLUME_UPLOAD_DIR}:/app/uploads
    depends_on:
      redis-server:
        condition: service_healthy
      mysql-server:
        condition: service_healthy

  mysql-server:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - 3306:3306
    volumes:
      - mysql_data_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      retries: 10

  redis-server:
    image: redis
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  mysql_data_volume: